name: Publish

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode (production/local)"
        required: false
        default: "production"
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MFE_BUILD_MODE: ${{ inputs.build_mode || 'production' }}
      MFE_DEFAULT_GRAPHQL_HTTP_URL: ${{ secrets.MFE_DEFAULT_GRAPHQL_HTTP_URL }}
      MFE_DEFAULT_GRAPHQL_WS_URL: ${{ secrets.MFE_DEFAULT_GRAPHQL_WS_URL }}
      MFE_DEFAULT_GRAPHQL_AUTH_TOKEN: ${{ secrets.MFE_DEFAULT_GRAPHQL_AUTH_TOKEN }}
      DIRECTUS_BASE_URL: ${{ secrets.DIRECTUS_BASE_URL }}
      DIRECTUS_STATIC_TOKEN: ${{ secrets.DIRECTUS_STATIC_TOKEN }}
      DIRECTUS_MODULE_SITE_KEY: ${{ secrets.DIRECTUS_MODULE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve Bundle URL
        id: bundle
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/example-mfe.js"
            echo "bundle_url=${URL}" >> "$GITHUB_OUTPUT"
          else
            echo "bundle_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: example-mfe-dist
          path: |
            dist/example-mfe.js
            dist/example-mfe.js.map
            dist/module.definition.json
            directus/cms-module.seed.json
            directus/cms-block-module.props.example.json

      - name: Sync Module To Directus
        if: ${{ env.DIRECTUS_BASE_URL != '' && env.DIRECTUS_STATIC_TOKEN != '' }}
        env:
          MODULE_SITE_KEY: ${{ env.DIRECTUS_MODULE_SITE_KEY }}
          MODULE_STATUS: published
          MODULE_REFRESH_TARGET: both
          MFE_MODULE_VERSION: ${{ github.ref_name }}
          MFE_BUNDLE_URL: ${{ steps.bundle.outputs.bundle_url }}
        run: npm run sync:directus

      - name: Create GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: |
            dist/example-mfe.js
            dist/example-mfe.js.map
            dist/module.definition.json
            directus/cms-module.seed.json
            directus/cms-block-module.props.example.json
